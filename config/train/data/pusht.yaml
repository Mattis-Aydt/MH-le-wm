dataset:
  num_steps: 1
  frameskip: 5
  name: pusht_expert_train.lance
  keys_to_load:
    - pixels
    - action
  keys_to_cache:
    - action

data_sampling:
  max_interval_sum: 200
  pool_ceiling_multiplier: 50
  interval_dist_p: 0.5
  num_pools: 20
  batch_size: ${loader.batch_size}
  seed: ${seed}
  stride: 4